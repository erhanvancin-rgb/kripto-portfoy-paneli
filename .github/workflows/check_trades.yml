name: Trade Check and Alert Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trade-check-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bot dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run one market check
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python trade_check_bot.py

      - name: Persist alert memory and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sinyal_hafizasi.json mail_log.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist trade bot state [skip ci]"
            git push
          fi
