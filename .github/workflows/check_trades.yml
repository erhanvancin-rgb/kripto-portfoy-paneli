name: Trade Check and Alert Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch:        # Elle tetiklemeye izin verir

jobs:
  run-bot:
  runs-on: ubuntu-latest
  steps:
    - name: Repository checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install bot dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas gspread pytz

    - name: Run trade check engine
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      run: |
        python check_engine.py
