name: Trade Check and Alert Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch:        # Elle tetiklemeye izin verir

# Üst üste binen çalıştırmalar aynı maili iki kez göndermesin
concurrency:
  group: trade-check-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy gspread pytz

      - name: Run trade check engine
        # Adım zaman aşımı iş zaman aşımından kısa: takılırsa aşağıdaki uyarı adımı yine çalışır
        timeout-minutes: 7
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u check_engine.py

      - name: Alert if bot failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Trade bot çalışması BAŞARISIZ oldu. GitHub Actions loglarına bakın: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
