name: Trade Check and Alert Bot

on:
  schedule:
    # Her 5 dakikada bir otomatik çalışır
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manuel olarak test etmek isterseniz butonla da çalıştırabilirsiniz

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run trade check script
        env:
          # Eğer mail şifresi veya API anahtarları kullanıyorsanız buraya ekleyebiliriz
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python check_trades.py
