name: Trade Check and Alert Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir (GitHub yoğunlukta birkaç dk geciktirebilir)
  workflow_dispatch:        # Elle tetiklemeye izin verir

# Üst üste binen çalıştırmalar aynı bildirimi iki kez göndermesin
concurrency:
  group: trade-check-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy gspread google-auth pytz pycoingecko openpyxl

      # ÖNCE stop/kâr kontrolü ve Telegram bildirimi (kritik adım)
      - name: Run trade check engine
        timeout-minutes: 10
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u check_engine.py

      # Analiz adımı (CoinGecko) kritik değil: hata verse bile kontrol motorunu etkilemez
      - name: Run analysis (non-critical)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python -c "import islemverisi; islemverisi.tabloyu_analiz_et()"

      - name: Alert if bot failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Trade bot çalışması BAŞARISIZ oldu. Loglara bakın: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
